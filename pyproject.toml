[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clave"
version = "0.1.0"
authors = [{ name = "Savan Maurya" }]
description = "Local encrypted credentials for Python developers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["credentials", "secrets", "vault", "encryption", "fernet", "cli", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "cryptography>=50.0.2",
    "typer>=0.28,<1.0",
    "platformdirs>=4",
]

[project.urls]
Homepage = "https://github.com/savankrm/Clave"
Documentation = "https://github.com/savankrm/Clave/blob/main/USER_GUIDE.md"
Repository = "https://github.com/savankrm/Clave"
Issues = "https://github.com/savankrm/Clave/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "build", "hatchling", "pip-audit"]

[project.scripts]
clave = "clave.cli:app"

[tool.hatch.build.targets.sdist]
only-include = ["src/clave", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clave --cov-report=term-missing"

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
