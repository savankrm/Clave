name: Test a Python version
description: Run checks, tests, and the installed-wheel smoke test.
inputs:
  python-version:
    description: Python version to test.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Check Python ${{ inputs.python-version }}
      shell: bash
      run: |
        python -m pip install -e ".[dev]" twine
        python -m ruff check .
        python -m ruff format --check .
        python -m mypy --strict --python-version 3.10 src/clave
        python -m pytest tests examples/test_sample_login.py
    - name: Build and check distributions
      shell: bash
      env:
        DIST: dist/${{ inputs.python-version }}
      run: |
        python -m build --outdir "$DIST"
        python -m twine check --strict "$DIST"/*
    - name: Smoke-test the installed wheel
      shell: bash
      env:
        DIST: dist/${{ inputs.python-version }}
        SMOKE: .smoke/${{ inputs.python-version }}
      run: |
        python -m venv "$SMOKE"
        if [ "$RUNNER_OS" = Windows ]; then
          smoke_python="$SMOKE/Scripts/python.exe"
          smoke_clave="$SMOKE/Scripts/clave.exe"
        else
          smoke_python="$SMOKE/bin/python"
          smoke_clave="$SMOKE/bin/clave"
        fi
        "$smoke_python" -m pip install "$DIST"/*.whl
        "$smoke_clave" --help
        "$smoke_python" scripts/smoke_wheel.py "$SMOKE" "$smoke_clave"
