name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]" twine
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict --python-version 3.10 src/clave
      - run: python -m pytest tests examples/test_sample_login.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m venv .smoke
      - if: runner.os != 'Windows'
        run: .smoke/bin/python -m pip install dist/*.whl
      - if: runner.os != 'Windows'
        run: .smoke/bin/clave --help
      - if: runner.os != 'Windows'
        run: .smoke/bin/python scripts/smoke_wheel.py .smoke .smoke/bin/clave
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl).FullName
          .smoke/Scripts/python -m pip install $wheel
          .smoke/Scripts/clave --help
          .smoke/Scripts/python scripts/smoke_wheel.py .smoke .smoke/Scripts/clave.exe
