name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          check-latest: true
      - run: python -m pip install .
      - run: clave --help

  test:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/test-python
        with:
          python-version: ${{ matrix.python }}

  test-macos:
    name: macOS ${{ matrix.arch }} (Python ${{ matrix.first }}, ${{ matrix.second }}, ${{ matrix.third }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: Intel
            runner: macos-15-intel
            first: '3.10'
            second: '3.11'
            third: '3.12'
          - arch: ARM
            runner: macos-latest
            first: '3.13'
            second: '3.14'
            third: '3.15'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        id: checkout
      - name: Test Python ${{ matrix.first }}
        uses: ./.github/actions/test-python
        with:
          python-version: ${{ matrix.first }}
      - name: Test Python ${{ matrix.second }}
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/test-python
        with:
          python-version: ${{ matrix.second }}
      - name: Test Python ${{ matrix.third }}
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: ./.github/actions/test-python
        with:
          python-version: ${{ matrix.third }}

  pr-checks:
    name: PR checks
    if: always() && github.event_name == 'pull_request'
    needs: [test, test-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require the full test matrix to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
        run: |
          echo "Linux and Windows: $TEST_RESULT"
          echo "macOS: $MACOS_RESULT"
          test "$TEST_RESULT" = success && test "$MACOS_RESULT" = success
