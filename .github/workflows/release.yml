name: release rehearsal

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      rehearsal_run_id:
        description: Successful rehearsal run ID, required for production promotion
        type: string
        default: ''

permissions: {}
concurrency:
  group: clave-publication
  cancel-in-progress: false

jobs:
  build:
    if: inputs.destination == 'testpypi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install build twine pip-audit
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Inspect distribution paths and record hashes
        run: |
          python - <<'PY'
          import hashlib
          import tarfile
          import zipfile
          from pathlib import Path
          for path in sorted(Path('dist').iterdir()):
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                  assert 'clave/py.typed' in names
              else:
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              assert not any(part in {'.quality', '.smoke', '.git', '__pycache__'}
                             for name in names for part in Path(name).parts)
              assert not any(name.endswith(('.key', '.sqlite3')) for name in names)
              print(path.name, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - run: python -m venv .smoke
      - run: .smoke/bin/python -m pip install dist/*.whl
      - name: Audit resolved runtime dependencies
        run: |
          .smoke/bin/python -m pip freeze --exclude clave > release-dependencies.txt
          python -m pip_audit --no-deps --disable-pip -r release-dependencies.txt
      - name: Read the built package version
        id: metadata
        run: |
          .smoke/bin/python -c 'from importlib.metadata import version; print("version=" + version("clave"))' >> "$GITHUB_OUTPUT"
      - run: .smoke/bin/python scripts/smoke_wheel.py .smoke .smoke/bin/clave
      - uses: actions/upload-artifact@v7
        with:
          name: clave-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/clave/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: clave-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  verify-wheel:
    needs: [build, testpypi]
    name: Verify TestPyPI on Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: clave-distributions
          path: dist
      - name: Install exact release from TestPyPI in a fresh environment
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip download --index-url https://test.pypi.org/simple/ --no-deps --only-binary=:all: --dest downloaded "clave==$RELEASE_VERSION"
          cmp "dist/clave-$RELEASE_VERSION-py3-none-any.whl" "downloaded/clave-$RELEASE_VERSION-py3-none-any.whl"
          .smoke/bin/python -m pip install downloaded/*.whl
      - name: Smoke-test the installed wheel
        if: matrix.python == '3.10'
        run: .smoke/bin/python scripts/smoke_wheel.py .smoke .smoke/bin/clave
      - name: Smoke-test the installed wheel with an isolated X11 clipboard
        if: matrix.python == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y xauth xclip xvfb
          env -u WAYLAND_DISPLAY xvfb-run -a .smoke/bin/python scripts/smoke_wheel.py .smoke .smoke/bin/clave --clipboard
      - name: Verify the published wheel and source archive hashes
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import urlopen

          version = quote(os.environ["RELEASE_VERSION"], safe="")
          with urlopen(f"https://test.pypi.org/pypi/clave/{version}/json", timeout=30) as response:
              published = {item["filename"]: item["digests"]["sha256"] for item in json.load(response)["urls"]}
          for path in sorted(Path("dist").iterdir()):
              expected = hashlib.sha256(path.read_bytes()).hexdigest()
              if published.get(path.name) != expected:
                  raise SystemExit(f"TestPyPI hash does not match for {path.name}")
              print(path.name, expected)
          PY

  verify-testpypi:
    needs: verify-wheel
    runs-on: ubuntu-latest
    steps:
      - run: echo "TestPyPI wheel and source archive verified on Python 3.10 and 3.14."

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clave/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Validate the selected rehearsal
        uses: actions/github-script@v8
        env:
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        with:
          script: |
            const id = process.env.REHEARSAL_RUN_ID;
            if (!/^[1-9]\d*$/.test(id) || !Number.isSafeInteger(Number(id))) {
              throw new Error('A valid rehearsal run ID is required');
            }
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.path !== '.github/workflows/release.yml' ||
                run.head_branch !== 'main' ||
                run.head_sha !== context.sha ||
                run.event !== 'workflow_dispatch' ||
                run.conclusion !== 'success') {
              throw new Error('Select a successful rehearsal from this commit on main');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: Number(id), per_page: 100
            });
            if (!jobs.jobs.some(j => j.name === 'verify-testpypi' && j.conclusion === 'success')) {
              throw new Error('The rehearsal must include TestPyPI installation verification');
            }
      - uses: actions/download-artifact@v8
        with:
          name: clave-distributions
          path: dist
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
