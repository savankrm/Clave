name: release rehearsal

on:
  push:
    branches: [release/clave-0.1.0]
    paths: [.github/workflows/release.yml, PUBLISHING.md]
  workflow_dispatch:
    inputs:
      destination:
        description: Package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      rehearsal_run_id:
        description: Successful rehearsal run ID, required for production promotion
        type: string
        default: ''

permissions: {}
concurrency:
  group: clave-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || inputs.destination == 'testpypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install -e '.[dev]' twine
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --strict --python-version 3.10 src/clave
      - run: python -m pytest
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Inspect distribution paths and record hashes
        run: |
          python - <<'PY'
          import hashlib
          import tarfile
          import zipfile
          from pathlib import Path
          for path in sorted(Path('dist').iterdir()):
              if path.suffix == '.whl':
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
                  assert 'clave/py.typed' in names
              else:
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              assert not any(part in {'.quality', '.smoke', '.git', '__pycache__'}
                             for name in names for part in Path(name).parts)
              assert not any(name.endswith(('.key', '.sqlite3')) for name in names)
              print(path.name, hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - run: python -m venv .smoke
      - run: .smoke/bin/python -m pip install dist/*.whl
      - run: .smoke/bin/python scripts/smoke_wheel.py .smoke .smoke/bin/clave
      - uses: actions/upload-artifact@v4
        with:
          name: clave-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/clave/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clave-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          print-hash: true

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@v4
        with:
          name: clave-distributions
          path: dist
      - name: Install exact release from TestPyPI in a fresh environment
        run: |
          python -m venv .smoke
          .smoke/bin/python -m pip install 'cryptography>=50.0.2' 'typer>=0.28,<1.0' 'platformdirs>=4'
          .smoke/bin/python -m pip download --index-url https://test.pypi.org/simple/ --no-deps --only-binary=:all: --dest downloaded 'clave==0.1.0'
          cmp dist/clave-0.1.0-py3-none-any.whl downloaded/clave-0.1.0-py3-none-any.whl
          .smoke/bin/python -m pip install --no-deps downloaded/*.whl
          .smoke/bin/python scripts/smoke_wheel.py .smoke .smoke/bin/clave

  pypi:
    if: github.event_name == 'workflow_dispatch' && inputs.destination == 'pypi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/clave/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Validate the selected rehearsal
        uses: actions/github-script@v7
        env:
          REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
        with:
          script: |
            const id = process.env.REHEARSAL_RUN_ID;
            if (!/^\d+$/.test(id)) throw new Error('A rehearsal run ID is required');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(id)
            });
            if (run.path !== '.github/workflows/release.yml' ||
                run.head_branch !== 'release/clave-0.1.0' ||
                run.event !== 'push' || run.conclusion !== 'success') {
              throw new Error('Select a successful release-branch rehearsal');
            }
            const {data: jobs} = await github.rest.actions.listJobsForWorkflowRun({
              ...context.repo, run_id: Number(id), per_page: 100
            });
            if (!jobs.jobs.some(j => j.name === 'verify-testpypi' && j.conclusion === 'success')) {
              throw new Error('The rehearsal must include TestPyPI installation verification');
            }
      - uses: actions/download-artifact@v4
        with:
          name: clave-distributions
          path: dist
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
